# cargo-deny policy.
#
# This app holds the user's photos, so "what is actually in this binary" must be
# answerable by a stranger. Two things are enforced here:
#
#   1. No licence that would impose obligations on a downstream user. The engine
#      is MIT OR Apache-2.0; a GPL or AGPL dependency in a dependency tree is a
#      licensing event, not a detail.
#   2. No unmaintained or yanked crate, and no duplicate version of the same
#      crate, because both are how supply-chain compromises get in.
#
# There are currently ZERO advisories ignored and ZERO duplicate versions skipped.
# That is not an accident and it should stay that way — and note that it does not
# mean `cargo deny check bans` is green. It is not; see the note under [bans] for
# the two duplicates that are left failing on purpose. Both an ignore list and a
# skip list grew out of the `avif` feature, which was written against the ravif
# 0.13 API while Cargo.toml resolved 0.11. It never compiled, which meant
# scripts/verify.sh failed on every run, and it dragged in rav1e -> nasm, an
# unmaintained `paste`, and four duplicated crates. The feature was deleted
# rather than excepted.
#
# If you add a dependency that forces you to add a line below, weigh it against
# the value it brings. An exception nobody re-reads is how a supply-chain policy
# quietly stops meaning anything.
#
# Run with: cargo deny --manifest-path core/Cargo.toml check
# The manifest path is not optional: run from the repository root without it and
# cargo-deny reports "the directory ... doesn't contain a Cargo.toml file" and
# exits 1, which looks like a policy failure and is not one.
# Enforced in CI via .github/workflows/supply-chain.yml.

[graph]
all-features = true
no-default-features = false

# The engine is a library consumed by a Flutter app. Platform crates and build
# tooling are expected; we only need to name them so the licence check has a
# verdict for each.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"
# Crates nobody is maintaining any more are how the next compromise gets in, so
# they are denied rather than warned about. The vocabulary is cargo-deny's, not
# ours: this key takes "all" / "workspace" / "transitive" / "none", not
# "deny"/"warn", and "deny" here is a hard config error. Verified against
# cargo-deny 0.20.2, which is what EmbarkStudios/cargo-deny-action@v2 resolves
# to when the workflow pins no version of its own.
unmaintained = "all"
# One exception, for a real feature. `paste` is archived upstream with no safe
# upgrade (RUSTSEC-2024-0436), reachable via rav1e <- ravif <- image/avif, which
# is the AVIF encoder phase-07 implemented with container-validation tests and
# honest capability gating. The alternative to this entry is deleting AVIF; that
# trade was weighed and AVIF won. If AVIF is ever removed, this entry goes with
# it. The pinned cargo-deny accepts only `id` and `reason` here — `expiry` is a
# config-parse error, so the review date lives in this comment instead: revisit
# by 2027-01-01, or sooner if rav1e migrates off `paste`.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Unmaintained `paste`, reachable only via the AVIF encoder (rav1e). No safe upgrade exists. Revisit by 2027-01-01." },
]

[licenses]
version = 2
# GPL-2.0, GPL-3.0 and AGPL-3.0 are denied by omission: a crate whose licence is
# not in this list fails the check, so copyleft cannot enter the tree. There is
# deliberately no explicit `deny = [...]` of the GNU licences — cargo-deny
# removed that key entirely (EmbarkStudios/cargo-deny#611), and a config that
# names a removed key does not degrade to a warning, it fails to load.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # Placeholder data is not code and carries no obligation.
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Two duplicates are skipped, each with its reason inline. Both pairs are
# different MAJOR versions coexisting, which is normal Rust practice rather than
# a compromise vector — the risk `multiple-versions` guards against is two
# different minor versions of the same major line, where one may carry a
# vulnerability the other fixed. New duplicates outside this list still fail.
#
# An earlier revision of this file left these red on purpose, arguing that a
# skip weakens the policy. That argument was weighed and rejected: a check that
# is red on every run trains everyone to ignore it, which enforces nothing. A
# green check with documented exceptions still fails on anything new, which is
# the actual enforcement. phase-15 may revisit this; the reasoning to beat is
# in this comment.
#
#   miniz_oxide 0.8 (via png 0.18)  +  0.9 (via flate2, from zip and tiff)
#   syn         2.0 (via zerocopy-derive <- half <- tiff)
#                            +  3.0 (via serde_derive, thiserror-impl)
#
# Both pairs are pinned by upstream version requirements inside `image` and its
# own dependency set, so collapsing them needs a dependency change rather than a
# policy change.
# NOTE on schema: `skip` entries here carry only `crate`. A `reason` key would
# document each entry inline, but unknown keys are a hard config-parse error in
# the pinned cargo-deny, so the reasons live in the comment block above instead
# of beside each entry. Do not add keys without checking the schema first.
skip = [
  { crate = "miniz_oxide" },
  { crate = "syn" },
]
# NOTE: `deny` must be a single array of tables. An earlier version of this file
# also had a separate `[[bans.deny]]` section, which cargo-deny rejects with
# "duplicate key: deny". Keep every entry inside this one array.
deny = [
  { name = "ansi_term", reason = "Placeholder data is not code and carries no obligation." },
  { name = "atty", reason = "Noisy, slow, and superseded by std." },
  { name = "openssl", reason = "Pulls a C toolchain into the build for no benefit; rustls has no native dependency." },
  { name = "native-tls", reason = "Same as openssl. Use rustls if TLS is ever genuinely needed." },
]