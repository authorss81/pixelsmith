# cargo-deny policy.
#
# This app holds the user's photos, so "what is actually in this binary" must be
# answerable by a stranger. Two things are enforced here:
#
#   1. No licence that would impose obligations on a downstream user. The engine
#      is MIT OR Apache-2.0; a GPL or AGPL dependency in a dependency tree is a
#      licensing event, not a detail.
#   2. No unmaintained or yanked crate, and no duplicate version of the same
#      crate, because both are how supply-chain compromises get in.
#
# There are currently ONE advisory ignored and SIX crate names skipped for a
# duplicate version. Neither is an accident and both are explained where they
# are; note that "one ignored advisory" does not mean `cargo deny check` is
# green for free — it means the green is bought with a documented, dated
# decision rather than a blanket suppression.
#
# Both an ignore list and a skip list grew out of the `avif` feature, which was
# written against the ravif 0.13 API while Cargo.toml resolved 0.11. It never
# compiled, which meant scripts/verify.sh failed on every run, and it dragged in
# rav1e -> nasm, an unmaintained `paste`, and duplicated crates. The feature was
# deleted rather than excepted.
#
# If you add a dependency that forces you to add a line below, weigh it against
# the value it brings. An exception nobody re-reads is how a supply-chain policy
# quietly stops meaning anything.
#
# Run with: cargo deny --manifest-path core/Cargo.toml check
# The manifest path is not optional: run from the repository root without it and
# cargo-deny reports "the directory ... doesn't contain a Cargo.toml file" and
# exits 1, which looks like a policy failure and is not one.
#
# Run with: bash scripts/deny-check.sh
# Same policy, plus an offline subset for a machine without cargo-deny installed
# and a negative control that proves each check rejects an injected violation.
# Enforced in CI via .github/workflows/supply-chain.yml, which also injects the
# violations into its own copy of cargo-deny so the real tool is proved able to
# fail rather than merely enabled.

[graph]
all-features = true
no-default-features = false

# The engine is a library consumed by a Flutter app. Platform crates and build
# tooling are expected; we only need to name them so the licence check has a
# verdict for each.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"
# Crates nobody is maintaining any more are how the next compromise gets in, so
# they are denied rather than warned about. The vocabulary is cargo-deny's, not
# ours: this key takes "all" / "workspace" / "transitive" / "none", not
# "deny"/"warn", and "deny" here is a hard config error. Verified against
# cargo-deny 0.20.2, which is what EmbarkStudios/cargo-deny-action@v2 resolves
# to when the workflow pins no version of its own.
unmaintained = "all"
# One exception, for a real feature. `paste` is archived upstream with no safe
# upgrade (RUSTSEC-2024-0436), reachable via rav1e <- ravif <- image/avif, which
# is the AVIF encoder phase-07 implemented with container-validation tests and
# honest capability gating. The alternative to this entry is deleting AVIF; that
# trade was weighed and AVIF won. If AVIF is ever removed, this entry goes with
# it. The pinned cargo-deny accepts only `id` and `reason` here — `expiry` is a
# config-parse error, so the review date lives in this comment instead: revisit
# by 2027-01-01, or sooner if rav1e migrates off `paste`.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Unmaintained `paste`, reachable only via the AVIF encoder (rav1e). No safe upgrade exists. Revisit by 2027-01-01." },
]

[licenses]
version = 2
# GPL-2.0, GPL-3.0 and AGPL-3.0 are denied by omission: a crate whose licence is
# not in this list fails the check, so copyleft cannot enter the tree. There is
# deliberately no explicit `deny = [...]` of the GNU licences — cargo-deny
# removed that key entirely (EmbarkStudios/cargo-deny#611), and a config that
# names a removed key does not degrade to a warning, it fails to load.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # Placeholder data is not code and carries no obligation.
  "Unlicense",
  # The Independent JPEG Group license, carried by `jpeg-encoder` (used for
  # progressive JPEG output since phase-07). Same terms as the libjpeg every
  # Linux ships: permissive, commercial use allowed, acknowledgement required.
  # FSF classifies it as free. Valid SPDX identifier.
  "IJG",
  # NCSA, carried by `libfuzzer-sys` 0.4.13, which is a *normal* dependency of
  # `rav1e` under `cfg(fuzzing)` — a cfg no shipped build sets, but one
  # `--filter-platform` cannot switch off and cargo-deny does not exclude, so the
  # crate is in the graph the gate walks and its licence has to be permitted for
  # `cargo deny check licenses` to pass. The licence itself is the
  # University of Illinois/NCSA Open Source License: permissive, attribution
  # only, OSI-approved, and the same terms libjpeg and ncurses carry.
  #
  # Not added speculatively: phase-15 found this by running the policy against the
  # real graph rather than by reading it, which is the argument for running the
  # policy at all.
  "NCSA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Six duplicate crate names are skipped, each with its real reason in the comment
# above. Every pair is two different MAJOR versions coexisting, which is normal
# Rust practice rather than a compromise vector — the risk `multiple-versions`
# guards against is two different minor versions of the same major line, where one
# may carry a vulnerability the other fixed. Any new duplicate outside this list
# fails the build, and the `duplicate-versions` job in
# .github/workflows/supply-chain.yml re-derives this list from `cargo tree` so a
# skip entry that no longer corresponds to a duplicate is visible.
#
# The parents below were read out of `cargo metadata`, not remembered. None of
# them can be collapsed without an upstream version bump: every one of these
# duplicates is two crates' requirements of the same dependency disagreeing, and
# this project is a leaf consumer of both sides.
#
#   miniz_oxide 0.8.9  <- png 0.18.1, exr 1.74.2
#                  0.9.1  <- flate2 1.1.10 (via zip, and directly for colour.rs's iCCP)
#
#   syn          2.0.119 <- zerocopy-derive 0.8.59 (via half <- tiff),
#                          plus proptest's derive chain
#                  3.0.6  <- serde_derive 1.0.229, thiserror-impl 2.0.21
#
#   getrandom    0.3.4  <- rand_core 0.9.5 (via proptest)
#                  0.4.3  <- tempfile 3.27.0 (a dev-dependency), jobserver 0.1.35
#               and therefore also:
#   r-efi        5.3.0  <- getrandom 0.3.4
#                  6.0.0  <- getrandom 0.4.3
#               r-efi only exists on the UEFI/wasi targets of getrandom, so it is
#               not in any shipped binary. It is listed because cargo-deny
#               resolves every cfg target and sees both.
#
#   itertools    0.13.0 <- criterion 0.7.0 and criterion-plot 0.6.0 (dev)
#                  0.14.0 <- rav1e 0.8.1 (via ravif <- image/avif)
#
#   quick-error  1.2.3  <- rusty-fork 0.3.1 (proptest's process-forking support)
#                  2.0.1  <- image-webp 0.2.4, tiff 0.11.3, ravif 0.13.0
#
# NOTE on schema: `skip` entries here carry only `crate`. A `reason` key would
# document each entry inline, but unknown keys are a hard config-parse error in
# the pinned cargo-deny, so the reasons live in the comment block above instead
# of beside each entry. Do not add keys without checking the schema first.
skip = [
  { crate = "miniz_oxide" },
  { crate = "syn" },
  { crate = "getrandom" },
  { crate = "r-efi" },
  { crate = "itertools" },
  { crate = "quick-error" },
]
# NOTE: `deny` must be a single array of tables. An earlier version of this file
# also had a separate `[[bans.deny]]` section, which cargo-deny rejects with
# "duplicate key: deny". Keep every entry inside this one array.
deny = [
  { name = "ansi_term", reason = "Placeholder data is not code and carries no obligation." },
  { name = "atty", reason = "Noisy, slow, and superseded by std." },
  { name = "openssl", reason = "Pulls a C toolchain into the build for no benefit; rustls has no native dependency." },
  { name = "native-tls", reason = "Same as openssl. Use rustls if TLS is ever genuinely needed." },
]