# cargo-deny policy.
#
# This app holds the user's photos, so "what is actually in this binary" must be
# answerable by a stranger. Two things are enforced here:
#
#   1. No licence that would impose obligations on a downstream user. The engine
#      is MIT OR Apache-2.0; a GPL or AGPL dependency in a dependency tree is a
#      licensing event, not a detail.
#   2. No unmaintained or yanked crate, and no duplicate version of the same
#      crate, because both are how supply-chain compromises get in.
#
# There are currently ZERO advisories ignored and ZERO duplicate versions skipped.
# That is not an accident and it should stay that way. Both an ignore list and a
# skip list grew out of the `avif` feature, which was written against the ravif
# 0.13 API while Cargo.toml resolved 0.11. It never compiled, which meant
# scripts/verify.sh failed on every run, and it dragged in rav1e -> nasm, an
# unmaintained `paste`, and four duplicated crates. The feature was deleted
# rather than excepted.
#
# If you add a dependency that forces you to add a line below, weigh it against
# the value it brings. An exception nobody re-reads is how a supply-chain policy
# quietly stops meaning anything.
#
# Run with: cargo deny check
# Enforced in CI via .github/workflows/supply-chain.yml.

[graph]
all-features = true
no-default-features = false

# The engine is a library consumed by a Flutter app. Platform crates and build
# tooling are expected; we only need to name them so the licence check has a
# verdict for each.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # Placeholder data is not code and carries no obligation.
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# NOTE: `deny` must be a single array of tables. An earlier version of this file
# also had a separate `[[bans.deny]]` section, which cargo-deny rejects with
# "duplicate key: deny". Keep every entry inside this one array.
deny = [
  { name = "ansi_term", reason = "Placeholder data is not code and carries no obligation." },
  { name = "atty", reason = "Noisy, slow, and superseded by std." },
  { name = "openssl", reason = "Pulls a C toolchain into the build for no benefit; rustls has no native dependency." },
  { name = "native-tls", reason = "Same as openssl. Use rustls if TLS is ever genuinely needed." },
]