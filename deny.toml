# cargo-deny policy.
#
# This app holds the user's photos, so "what is actually in this binary" must be
# answerable by a stranger. Two things are enforced here:
#
#   1. No licence that would impose obligations on a downstream user. The engine
#      is MIT OR Apache-2.0; a GPL or AGPL dependency in a dependency tree is a
#      licensing event, not a detail.
#   2. No unmaintained or yanked crate, and no duplicate version of the same
#      crate, because both are how supply-chain compromises get in.
#
# Run with: cargo deny check
# Enforced in CI via .github/workflows/supply-chain.yml.

[graph]
all-features = true
no-default-features = false

# The engine is a library consumed by a Flutter app. Platform crates and build
# tooling are expected; we only need to name them so the licence check has a
# verdict for each.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is archived upstream with no safe upgrade (RUSTSEC-2024-0436).
  # It is reachable ONLY through the opt-in `avif` feature, via
  # rav1e -> ravif -> paste. The default build does not contain it.
  #
  # A time-boxed exception, not a permanent shrug: the expiry makes cargo-deny
  # start failing again, and phase-07 is the phase that decides whether AVIF
  # encoding ships at all. If it does not, delete the feature and this entry
  # together.
  # A time-boxed exception in prose rather than in a field: the cargo-deny
  # version pinned by the action accepts only `id` and `reason` here, so
  # `expiry` is a config-parse error rather than a deadline. The date is in the
  # reason text and in docs/SUPPLY-CHAIN.md so it is still tracked.
  { id = "RUSTSEC-2024-0436", reason = "Unmaintained `paste`, reachable only via the opt-in `avif` feature (rav1e). No safe upgrade exists. MUST BE RESOLVED BY 2027-01-01: either drop the avif feature or move to an encoder that does not depend on rav1e." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # Placeholder data is not code and carries no obligation.
  "Unlicense",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# Ring pulls in a small C library under a permissive but non-SPDX-identifiable
# notice. Reviewed: no source-distribution obligation.
crate = "ring"
allow = ["LicenseRef-ring"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# NOTE: `deny` must be a single array of tables. An earlier version of this file
# also had a separate `[[bans.deny]]` section, which cargo-deny rejects with
# "duplicate key: deny". Keep every entry inside this one array.
deny = [
  { name = "ansi_term", reason = "Placeholder data is not code and carries no obligation." },
  { name = "atty", reason = "Noisy, slow, and superseded by std." },
  { name = "openssl", reason = "Pulls a C toolchain into the build for no benefit; rustls has no native dependency." },
  { name = "native-tls", reason = "Same as openssl. Use rustls if TLS is ever genuinely needed." },
]

# Duplicate versions are denied by default. These four are the only exceptions,
# and every one of them comes from rav1e's pinned dependency set under the
# opt-in `avif` feature — none of them is reachable from the default build.
# phase-07 either resolves them by dropping or replacing the AVIF encoder, or
# moves this list to a documented "accepted risk" in docs/SUPPLY-CHAIN.md.
skip = [
  { crate = "miniz_oxide", reason = "rav1e (avif) pins an older miniz_oxide alongside the current one." },
  { crate = "syn", reason = "rav1e (avif) pins an older syn alongside the current one." },
  { crate = "thiserror", reason = "rav1e (avif) pins an older thiserror alongside the current one." },
  { crate = "thiserror-impl", reason = "rav1e (avif) pins an older thiserror-impl alongside the current one." },
]