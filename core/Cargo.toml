[package]
name = "pixelsmith_core"
version = "0.1.0"
edition = "2024"
description = "Memory-safe local image processing engine: decode, resize, compress, strip metadata. Zero network I/O."
license = "MIT OR Apache-2.0"
repository = "https://github.com/authorss81/pixelsmith"
homepage = "https://github.com/authorss81/pixelsmith"
documentation = "https://docs.rs/pixelsmith_core"
readme = "../README.md"
rust-version = "1.85"
keywords = ["image", "resize", "jpeg", "webp", "exif", "offline", "privacy"]
categories = ["multimedia::images"]
exclude = ["target/**"]

[lib]
name = "pixelsmith_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
  "rayon",
] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zip = { version = "6", default-features = false, features = ["deflate", "time"] }
thiserror = "2"
base64 = { version = "0.23.1", features = ["alloc"] }
# JPEG with a real encoder configuration. `image`'s own JPEG encoder writes
# baseline 4:4:4 and exposes no sampling-factor or progressive control, so
# phase-07 needs an encoder that has them; see docs/JPEG.md for why this one.
# Pure Rust, no C, no build script.
jpeg-encoder = "0.6"

[features]
default = ["avif"]
# Lossy WebP via libwebp. Off by default so the pure-Rust build has no C
# toolchain requirement and stays fast to compile in CI; WebP output then falls
# back to the lossless encoder, which still beats PNG for photographs.
webp-lossy = ["dep:webp"]
# HEIC/HEIF decode, the format an iPhone actually photographs in. Off by
# default until phase-08 has built it for all four shipped targets: an opt-in
# feature that has never been cross-compiled is a promise nobody has checked,
# and the engine is more useful with a HEIC photo than with one fewer row in
# the capability list. See docs/HEIC.md for the comparison this choice rests on.
#
# `default-features = false` with only `std`: the `parallel` feature would give
# heic-rs its own rayon pool, and the engine already owns a rayon pool for the
# batch path. Decoding inside one of our own rayon workers would either nest
# pools or oversubscribe the machine, so the codec stays serial per file and
# parallelism stays where it belongs: across files.
heic = ["dep:heic-rs"]
# AVIF *write*. On by default, deliberately, and this comment is the reasoning.
#
# `avif` is `image`'s own AVIF encoder, which is rav1e through ravif: pure Rust,
# no C toolchain, no nasm (that is `image/nasm`, which nothing here enables),
# and no build script. So the two reasons the other opt-in codecs are off —
# a C toolchain in the build, and an unverified cross-compile — do not apply in
# the same way: the crate compiles anywhere Rust does, which is all four shipped
# targets.
#
# What it costs is build time and AV1 encode being roughly two orders of
# magnitude slower than JPEG, both documented in docs/ARCHITECTURE.md. The slow
# part is per file and the batch path parallelises across files, so a 200-image
# AVIF batch still uses every core.
#
# The build is on by default but the *decoder* is not, because this tree has no
# AV1 decoder at all (`image`'s avif-native/dav1d path is not enabled, and
# `heic-rs` decodes HEVC only). `capabilities().avif_decode` says so, so the UI
# cannot imply a round trip it cannot make.
avif = ["image/avif"]

[dependencies.webp]
version = "0.3"
optional = true

[dependencies.heic-rs]
version = "0.1.1"
optional = true
default-features = false
features = ["std"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# The same crate as the dependency above, plus `bench`, which is what publishes
# `heic_rs::hevc::synth`. That module builds complete HEVC bitstreams bit by bit,
# so the HEIC fixtures in `core/src/heic.rs`'s tests are generated rather than
# committed: no binary blobs in the repository, and no third-party photograph
# whose licence we would have to reason about. A dev-dependency's features are
# not unified into a plain `cargo build --release`, so nothing here reaches the
# shipped library.
heic-rs = { version = "0.1.1", default-features = false, features = ["std", "bench"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true