[package]
name = "pixelsmith_core"
version = "0.1.0"
edition = "2024"
description = "Memory-safe local image processing engine: decode, resize, compress, strip metadata. Zero network I/O."
license = "MIT OR Apache-2.0"
repository = "https://github.com/authorss81/pixelsmith"
homepage = "https://github.com/authorss81/pixelsmith"
documentation = "https://docs.rs/pixelsmith_core"
readme = "../README.md"
rust-version = "1.85"
keywords = ["image", "resize", "jpeg", "webp", "exif", "offline", "privacy"]
categories = ["multimedia::images"]
exclude = ["target/**"]

[lib]
name = "pixelsmith_core"
crate-type = ["lib", "cdylib", "staticlib"]
# `cargo bench` builds every target that has `bench = true`, and the lib is one
# of them — so adding any [[bench]] below made cargo compile `pixelsmith_core`
# twice with different `image` feature sets (once as a bench target, where
# dev-dependencies unify, once as the dependency the bench binaries link) and
# emit "output filename collision" four times. The two builds produce two
# distinct `image` rlibs, and a benchmark that hands one to the other fails to
# compile with a `DynamicImage` type mismatch that has nothing to do with
# whatever it is trying to measure.
#
# The lib holds no `#[bench]` function and never will — benchmarking a unit is
# what `core/benches/` is for — so this costs nothing.
bench = false

[[bin]]
name = "px-abi-dump"
path = "src/bin/px-abi-dump.rs"
# `cargo bench` builds and *runs* a libtest harness for every binary target as
# well as for every `[[bench]]`, and it forwards everything after `--` to all of
# them. libtest does not know `--profile`, so
#
#   cargo bench --all-features -- --profile ci
#
# died on the engine's own ABI-dump tool with `error: Unrecognized option:
# 'profile'`, before a single benchmark ran, naming a binary rather than a
# benchmark. `bench = false` is the fix and costs nothing: this target has no
# `#[bench]` function and never will — it dumps the FFI ABI and runs the sandbox
# worker. `cargo test` still builds and runs it, which is what it is for.
bench = false

[dependencies]
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
  "bmp",
  "tiff",
  "ico",
  "rayon",
] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zip = { version = "6", default-features = false, features = ["deflate", "time"] }
thiserror = "2"
base64 = { version = "0.23.1", features = ["alloc"] }
# JPEG with a real encoder configuration. `image`'s own JPEG encoder writes
# baseline 4:4:4 and exposes no sampling-factor or progressive control, so
# phase-07 needs an encoder that has them; see docs/JPEG.md for why this one.
# Pure Rust, no C, no build script.
jpeg-encoder = "0.6"

# `setrlimit`/`getrlimit` for the sandbox's address-space ceiling. Unix-only,
# already in the dependency tree through rayon and friends, and not a
# network-capable crate, so it does not touch hard rule 1.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["avif", "webp-lossy"]
# Lossy WebP via libwebp, ON by default since phase-08. The reasoning, and the
# measurement behind it:
#
# WebP without it is lossless, which means no quality control, no byte ceiling,
# and files that lose to JPEG for most photographs — measured on the 600x400
# gradient fixture in `format::tests::photo`: 101,656 bytes lossless against
# 2,638 at q80. That is 39x, and it is the difference between a resizer whose
# WebP export is worth choosing and one where it is an also-ran.
#
# What it costs is a C toolchain. `webp` links libwebp through `libwebp-sys`,
# which compiles 159 vendored .c files with `cc`. Measured on this CI runner, a
# cold `cargo build --release --lib`: 55 s without the feature, 1 m 34 s with it.
# So it is 39 extra seconds, not a new toolchain to install — `cc` is the same
# compiler already building the Rust code, no CMake, no nasm, and no code
# generator. That is the line that mattered: `avif` and `jpeg-encoder` are pure
# Rust and need none of this, and `webp-lossy` was off for a long time for the
# C-toolchain reason. Now that a CI job builds it for every shipped target
# keeping it off would mean shipping an encoder the matrix has not checked.
#
# That job is NOT in the tree yet: `workspace/phase-08/build-webp-lossy-matrix.patch`
# adds a `webp-lossy-matrix` job to `.github/workflows/build.yml` for Linux x64,
# Windows x64 and arm64, macOS x64 and arm64, Android arm64 and x86_64, and iOS
# arm64, but this pipeline's push credential is refused `workflows` permission on
# that path — the same class of limit as the `app/` submodule being unpushable.
# Until it is applied, the honest statement is the one the phase prompt asks for:
# lossy WebP is claimed for no target, because no CI job builds it yet. See
# `docs/phase-status.md` under phase-08.
#
# The fallback is kept deliberately, and is not dead code: a target that cannot
# compile C can still write WebP, just losslessly, and `is_lossless` reports that
# honestly for it. `format::tests::webp_reports_the_truth_about_this_build`
# covers both configurations.
webp-lossy = ["dep:webp"]
# HEIC/HEIF decode, the format an iPhone actually photographs in. Still off by
# default. phase-08 was the phase this comment pointed at, and it enabled
# `webp-lossy` rather than this: the reason recorded here was "an opt-in feature
# that has never been cross-compiled is a promise nobody has checked", and the
# honest answer is that the check has still not happened for `heic` — the
# `webp-lossy-matrix` CI job does not build it. Enabling it would put the flag
# in front of a target matrix nothing has run against. See docs/HEIC.md for the
# comparison this choice rests on.
#
# `default-features = false` with only `std`: the `parallel` feature would give
# heic-rs its own rayon pool, and the engine already owns a rayon pool for the
# batch path. Decoding inside one of our own rayon workers would either nest
# pools or oversubscribe the machine, so the codec stays serial per file and
# parallelism stays where it belongs: across files.
heic = ["dep:heic-rs"]
# AVIF *write*. On by default, deliberately, and this comment is the reasoning.
#
# `avif` is `image`'s own AVIF encoder, which is rav1e through ravif: pure Rust,
# no C toolchain, no nasm (that is `image/nasm`, which nothing here enables),
# and no build script. So the two reasons `webp-lossy` and `heic` were opt-in —
# a C toolchain in the build, and an unverified cross-compile — do not apply in
# the same way: the crate compiles anywhere Rust does, which is all four shipped
# targets. It has since been joined by `webp-lossy`, which pays the C-toolchain
# cost deliberately because there is no alternative that writes lossy WebP.
#
# What it costs is build time and AV1 encode speed. Measured in release on the CI
# runner, single-threaded, one 1600×1200 photo: 3.2 s at quality 70 against 20 ms
# for a q85 4:2:0 JPEG, and 17 s for a 4032×3024 one. That is roughly two orders
# of magnitude, and it is the price of the smallest file at a given quality. The
# slow part is per file and the batch path parallelises across files, so a
# 200-image AVIF batch still uses every core — but a single AVIF export is a
# progress bar, not an instant. Both numbers are in docs/ARCHITECTURE.md.
#
# The build is on by default but the *decoder* is not, because this tree has no
# AV1 decoder at all (`image`'s avif-native/dav1d path is not enabled, and
# `heic-rs` decodes HEVC only). `capabilities().avif_decode` says so, so the UI
# cannot imply a round trip it cannot make.
avif = ["image/avif"]

# SIMD resize, OFF by default. `fast_image_resize` is pure Rust with runtime CPU
# detection and no C toolchain and no nasm, so unlike `webp-lossy` it costs almost
# nothing at build time on any target: three new crates in the lockfile, and 10 s
# on a cold `cargo build --release --lib` on this CI runner (70 s to 80 s). What it
# costs is a second code path that has to be proved to agree with the reference,
# and phase-09 spent its time on that rather than on the build.
#
# It does have one build script, in `pulp`, a dependency `rav1e` already pulls in;
# `pulp`'s build.rs only asks `version_check` what the Rust version is. There is no
# code generation and nothing that shells out to a C compiler.
#
# Off by default because a second resampling kernel is a permanent maintenance
# cost, and because the measured win is not free of a caveat: every number in
# docs/BENCHMARKS.md was taken on an x86-64 runner with AVX2, and the crate
# dispatches on runtime CPU features, so an ARM phone runs a different kernel and
# the speedup there is unmeasured. Flipping the default is a phase-10 decision
# with an ARM machine in the room.
#
# The reference kernel in `image` stays the default and stays the correctness
# oracle: `resize::resample_reference` is the thing the SIMD path is measured
# against, so deleting it would delete the only way to check the other one. See
# docs/BENCHMARKS.md for the measured difference and docs/ARCHITECTURE.md for
# the module.
#
# `only_u8x4` drops every convolution kernel except U8x4. `resize::simd`
# normalises to RGBA8 before calling, which is not a limitation imposed on it —
# `image::imageops::resize` on a `DynamicImage` already goes through
# `GenericImageView`, whose associated `Pixel` is `Rgba<u8>`, so the reference
# has always produced RGBA8 whatever the source buffer type was. The flag
# therefore removes code this build can never call, and nothing else.
simd = ["dep:fast_image_resize", "fast_image_resize/only_u8x4"]

[dependencies.fast_image_resize]
# SIMD convolution resampler. Chosen over `libvips` deliberately: libvips is a
# C library with a build script and a large native toolchain requirement, and it
# would be paid on every target to accelerate one operation. MIT OR Apache-2.0,
# matching the engine, so it needs no entry in deny.toml's licence list.
#
# `default-features = false` with an explicit `std`: the default feature set is
# `std`, and the crate is `no_std` otherwise. `image` is NOT enabled — the
# optional integration is the one thing this tree must not take, because it
# would put a second `image` version in the tree and hard rule 1 wants the
# engine's dependency graph small and legible.
version = "6.1"
optional = true
default-features = false
features = ["std"]

[dependencies.webp]
# Safe bindings to libwebp, the reference WebP implementation. `libwebp-sys`
# vendors libwebp's own C source and compiles it with `cc`, so this is where the
# C toolchain requirement comes from — see the `webp-lossy` feature comment above
# for the measurement that made paying it worth it.
#
# 0.3 is the only published line: there is no 1.x, and `cargo add webp@1` fails
# with "could not be found in registry index". It is not a maintained crate in the
# usual sense (last release 2019), which is recorded in deny.toml rather than
# hidden — the reason it is still the right pick is that it is the only binding
# to the *reference* encoder, and the encoder's output is what every browser and
# CDN is tested against.
#
# Two things about it to know before using it, both of which `encode_webp` in
# format.rs works around and asserts:
#
#   1. `Encoder::encode` unwraps internally. A dimension libwebp refuses comes
#      back as a panic, not an `Err`, so calling it on hostile input violates hard
#      rule 3. `encode_simple` returns the error instead.
#   2. `WebPMemory` borrows from libwebp, so it must be copied out before it
#      drops. Handled by the `Vec<u8>` the encode helpers return.
version = "0.3"
optional = true

[dependencies.heic-rs]
version = "0.1.1"
optional = true
default-features = false
features = ["std"]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# The performance regression gate's harness. `default-features = false` with
# `cargo_bench_support` only: criterion's defaults pull in `plotters` (a gnuplot
# binding, and gnuplot is not installed on a CI runner) and `rayon`, neither of
# which produces a number. The suite is single-threaded on purpose -- a
# criterion benchmark that used rayon's thread pool would report a number that
# depends on how many cores the runner happened to have.
#
# 0.7 rather than 0.8: 0.8 declares rust-version 1.86 and this crate declares
# 1.85, so `cargo add` picks 0.7 and a hard 0.8 would make the tree refuse to
# build on its own stated MSRV.
criterion = { version = "0.7", default-features = false, features = [
  "cargo_bench_support",
] }

# Already a normal dependency, and Cargo unifies the same version across normal
# and dev builds, so this adds no compilation to a release. It is here because an
# integration test under core/tests/ can only reach the crate's public API plus
# its dev-dependencies: building a valid fixture needs `image::DynamicImage`,
# and `worker::tests::photo` is inside a #[cfg(test)] module, so it is not
# visible from out here. Naming the same crate is the honest way to get a real
# fixture instead of committing binary blobs.
image = { version = "0.25", default-features = false }
# Same reason, and the same version as the normal dependency, so nothing extra
# is compiled. `exif::build_block` and `exif::field` are public, but naming their
# argument types requires depending on `kamadak-exif` directly. Hand-rolling a
# TIFF header instead was tried first and is a bad idea: an entry that is 14
# bytes instead of 12 still produces a file that parses as "no orientation",
# which makes every truncation test built on top of it silently vacuous.
kamadak-exif = "0.6"
# The same crate as the dependency above, plus `bench`, which is what publishes
# `heic_rs::hevc::synth`. That module builds complete HEVC bitstreams bit by bit,
# so the HEIC fixtures in `core/src/heic.rs`'s tests are generated rather than
# committed: no binary blobs in the repository, and no third-party photograph
# whose licence we would have to reason about. A dev-dependency's features are
# not unified into a plain `cargo build --release`, so nothing here reaches the
# shipped library.
heic-rs = { version = "0.1.1", default-features = false, features = ["std", "bench"] }

# One entry per hot path the phase prompt names: decode, resize, encode, the
# byte-target search, and the two EXIF paths.
#
# `harness = false` is what tells cargo to hand each file's `main` to criterion
# instead of to libtest. Declared explicitly rather than left to autobenches so
# that adding a file to benches/ cannot silently produce a libtest binary which
# runs one "benchmark", asserts nothing, and reports green -- the same class of
# green-but-checking-nothing as the FFI tests skipping when the library is
# missing, which `scripts/verify.sh` had to be taught to catch.
#
# `common` is a module directory, not a target: cargo does not autodiscover
# `benches/common/mod.rs`, which is why it needs no entry here.
[[bench]]
name = "decode"
harness = false

[[bench]]
name = "resize"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "target_bytes"
harness = false

[[bench]]
name = "exif"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Without this, `cargo bench --all-features` does not compile and does not run.
#
# `cargo bench` builds the `bench` profile from `release`, so the dependency graph
# is compiled with `panic = "abort"` (correct for the shipped library — see
# `docs/ARCHITECTURE.md` gotcha 8), while the benchmark binaries themselves are
# built with `unwind`, because libtest and criterion both have to unwind to
# report a failure at all. Cargo then builds that graph a second time for the
# bench targets, and the bench targets link a *different* `image` than the crate
# they are benchmarking. The result is 26 `mismatched types` errors and two
# `expected an Fn(...)` errors, none of which mention the real cause, and the
# same "output filename collision" warnings the `bench = false` note above
# describes. Nothing in the engine can be changed to avoid it; the profile can.
#
# Every other setting is inherited from `release`, which is the whole point: a
# benchmark compiled at `opt-level = 0` would time the wrong code.
#
# Cargo prints `warning: panic setting is ignored for bench profile` while doing
# this, which reads as though the key did nothing. It did: remove this section
# and the suite does not build.
[profile.bench]
panic = "unwind"
