name: build

# Produces the artefacts a user can actually install.
#
# This runs on every push so there is always an APK and an EXE to download once
# the Flutter app exists, and it is the mechanism phase-16 formalises into a
# signed release.
#
# Deliberately separate from `automation`: a broken build must never stop a
# phase, and a phase must never be able to publish a broken binary.
#
# Before phase-05 there is no app/, so every Flutter-dependent step is skipped
# and the engine-matrix job is the only thing that does real work. That is the
# intended state, not a degraded one.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build release mode (slower, needs signing secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read


jobs:
  # ---------------------------------------------------------------------------
  # The gate. This is the fast feedback loop: if the tree is red, say so in about
  # three minutes rather than waiting twenty for a phase run to discover it.
  #
  # It runs on every push, so a broken tree is caught before the autonomous
  # pipeline spends a job on it, and before a phase can be marked .done.
  gate:
    name: verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Run the verification gate
        run: |
          chmod +x scripts/*.sh
          set +e
          bash scripts/verify.sh 2>&1 | tee /tmp/verify.log
          rc=${PIPESTATUS[0]}
          echo "### verify.sh exit code: ${rc}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${rc}" -ne 0 ]; then
            echo "### Failing checks" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\s+FAIL:' /tmp/verify.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "${rc}"

  # ---------------------------------------------------------------------------
  detect:
    # One job, so the APK and EXE jobs do not each pay for a checkout just to
    # ask whether there is an app yet.
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Does the Flutter app exist yet?
        id: check
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "app/ present — Flutter artefacts will be built."
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "app/ absent — Rust-only tree, Flutter artefacts skipped."
          fi

  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub runner already ships an Android SDK, but `sdkmanager` is not
      # on PATH — it lives under $ANDROID_SDK_ROOT/cmdline-tools. Using the bare
      # name fails with "command not found", which is what broke this job.
      - name: Accept Android SDK licences
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build the Rust library for Android ABIs
        working-directory: core
        run: |
          # Gradle only picks up .so files from android/app/src/main/jniLibs/<abi>/.
          # An earlier revision wrote them to app/src/rust/jniLibs, where the
          # desktop builds look. The APK built fine and contained no native
          # library — it opened and would have crashed on first tap.
          mkdir -p ../app/android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a -t x86_64 \
            -o ../app/android/app/src/main/jniLibs \
            build --release --lib
          find ../app/android/app/src/main/jniLibs -name '*.so'

      - name: Build the APK
        working-directory: app
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ inputs.release }}" = "true" ]; then
            flutter build apk --release
          else
            # Debug-signed so CI can always produce an installable artefact.
            # phase-16 replaces this with a properly signed release build.
            flutter build apk --debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmith-apk
          path: app/build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify the APK is a real, installable archive
        working-directory: app
        run: |
          APK=$(find build/app/outputs -name '*.apk' | head -n1)
          if [ -z "${APK}" ]; then echo "::error::no APK produced"; exit 1; fi
          echo "APK: ${APK} ($(stat -c%s "${APK}") bytes)"
          # A zip bomb or an empty archive passes a size check silently.
          unzip -l "${APK}" | tail -n 1
          # An APK with no native library opens fine and crashes on first tap,
          # which no build log will ever tell you about.
          unzip -l "${APK}" | grep -q 'classes.dex' \
            || { echo "::error::APK has no classes.dex — this is not an app"; exit 1; }
          unzip -l "${APK}" | grep -q 'lib/.*/libpixelsmith_core\.so' \
            || { echo "::error::APK has no lib/*/libpixelsmith_core.so"; exit 1; }
          echo "OK: native engine present"

  # ---------------------------------------------------------------------------
  windows-exe:
    name: Windows EXE
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    # Must run on Windows: Flutter's Windows desktop toolchain is MSBuild-based
    # and will not cross-compile from Linux.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build the Rust library for Windows
        working-directory: core
        shell: pwsh
        run: |
          cargo build --release --lib
          # Stage the engine where CMake will install it from. See
          # windows/CMakeLists.txt -- `flutter build windows` ignores a DLL that
          # is merely sitting in windows/runner/ unless an install rule names it.
          New-Item -ItemType Directory -Force -Path ..\app\windows\runner | Out-Null
          Copy-Item target\release\pixelsmith_core.dll ..\app\windows\runner\ -Force
          # src/rust/ is gitignored, so a fresh checkout has no such directory.
          # It is the local-development output of native/build-engine.sh.
          New-Item -ItemType Directory -Force -Path ..\app\src\rust | Out-Null
          Copy-Item target\release\pixelsmith_core.dll ..\app\src\rust\ -Force

      - name: Build the EXE
        working-directory: app
        run: flutter build windows --release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmith-windows-exe
          path: app/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify the EXE and its native library
        working-directory: app
        shell: pwsh
        run: |
          # Look ONLY under runner/Release. A recursive search across
          # build/windows catches CMake's compiler-detection stub
          # (CMakeFiles/.../CompilerIdCXX.exe, 15 KB), which an earlier
          # revision mistook for the app and then rejected as "implausibly
          # small" - a correct check aimed at the wrong file.
          $release = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          if (-not (Test-Path $release)) {
            Write-Output "::error::no Release bundle at $release - flutter build windows produced nothing"
            exit 1
          }
          $exe = Join-Path $release 'shrinkray.exe'
          if (-not (Test-Path $exe)) {
            Write-Output "::error::no shrinkray.exe in $release"
            Get-ChildItem $release -Filter '*.exe' | ForEach-Object { Write-Output "  found: $($_.Name)" }
            exit 1
          }
          # A Flutter release EXE is legitimately small (~90 KB): the Dart AOT
          # snapshot ships separately as data/app.so. Only a floor is
          # meaningful here, to catch a truncated or stub binary.
          $exeSize = (Get-Item $exe).Length
          Write-Output "EXE: $exe ($exeSize bytes)"
          if ($exeSize -lt 40kb) {
            Write-Output "::error::EXE is $exeSize bytes - truncated or not a real Flutter binary"
            exit 1
          }
          # Prove it is a real Flutter bundle rather than a bare executable.
          if (-not (Test-Path (Join-Path $release 'data\flutter_assets'))) {
            Write-Output '::error::data/flutter_assets missing - this is not a Flutter bundle'
            exit 1
          }
          # The engine must ship inside the bundle. A missing DLL means the app
          # opens fine and then throws on the first resize, so this is the check
          # that actually matters.
          $dll = Join-Path $release 'pixelsmith_core.dll'
          if (-not (Test-Path $dll)) {
            Write-Output '::error::pixelsmith_core.dll is not in the bundle - the app would crash on first resize'
            Write-Output 'listing:'
            Get-ChildItem $release -Recurse -Filter '*.dll' | ForEach-Object { Write-Output "  $($_.FullName)" }
            exit 1
          }
          Write-Output "OK: engine DLL at $dll ($((Get-Item $dll).Length) bytes)"
          $total = (Get-ChildItem $release -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "OK: bundle total $([math]::Round($total / 1MB, 1)) MB"

  # ---------------------------------------------------------------------------
  # Not shipped yet. Best effort, so a macOS toolchain problem cannot turn the
  # build check red while Android and Windows are the only targets that matter.
  linux:
    name: Linux (best effort)
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: pixelsmith-linux
          path: app/build/linux/**/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The Rust engine on its own, for every platform, with no Flutter involved.
  # This is the artefact that proves the engine itself cross-compiles, and it is
  # the only thing that does real work before phase-05.
  engine-matrix:
    name: engine ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: aarch64-linux-android, os: ubuntu-latest }
          - { target: aarch64-apple-ios, os: macos-latest }
    steps:
      - uses: actions/checkout@v5

      # Cross-compiling to Android needs the NDK's linker. Plain `cargo build
      # --target aarch64-linux-android` fails at link time with no linker, so the
      # target goes through cargo-ndk, which supplies the right clang wrapper.
      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and test the engine
        working-directory: core
        # Windows runners default to PowerShell, which cannot parse bash `[[ ]]`.
        # This step is bash on every platform.
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *android* ]]; then
            cargo ndk -t arm64-v8a -o /tmp/px-jni build --release --lib --target aarch64-linux-android
          else
            cargo build --release --lib --target ${{ matrix.target }}
            cargo test --release --lib --target ${{ matrix.target }} --no-run
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: |
            core/target/${{ matrix.target }}/release/*.so
            core/target/${{ matrix.target }}/release/*.dll
            core/target/${{ matrix.target }}/release/*.dylib
            core/target/${{ matrix.target }}/release/*.a
          if-no-files-found: warn
          retention-days: 14