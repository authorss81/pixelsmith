name: build

# Produces the artefacts a user can actually install.
#
# This runs on every push so there is always an APK and an EXE to download once
# the Flutter app exists, and it is the mechanism phase-16 formalises into a
# signed release.
#
# Deliberately separate from `automation`: a broken build must never stop a
# phase, and a phase must never be able to publish a broken binary.
#
# Before phase-05 there is no app/, so every Flutter-dependent step is skipped
# and the engine-matrix job is the only thing that does real work. That is the
# intended state, not a degraded one.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build release mode (slower, needs signing secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: stable

jobs:
  # ---------------------------------------------------------------------------
  # The gate. This is the fast feedback loop: if the tree is red, say so in about
  # three minutes rather than waiting twenty for a phase run to discover it.
  #
  # It runs on every push, so a broken tree is caught before the autonomous
  # pipeline spends a job on it, and before a phase can be marked .done.
  gate:
    name: verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Run the verification gate
        run: |
          chmod +x scripts/*.sh
          set +e
          bash scripts/verify.sh 2>&1 | tee /tmp/verify.log
          rc=${PIPESTATUS[0]}
          echo "### verify.sh exit code: ${rc}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${rc}" -ne 0 ]; then
            echo "### Failing checks" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\s+FAIL:' /tmp/verify.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "${rc}"

  # ---------------------------------------------------------------------------
  detect:
    # One job, so the APK and EXE jobs do not each pay for a checkout just to
    # ask whether there is an app yet.
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Does the Flutter app exist yet?
        id: check
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
            echo "app/ present — Flutter artefacts will be built."
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "app/ absent — Rust-only tree, Flutter artefacts skipped."
          fi

  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub runner already ships an Android SDK. `android-actions/setup-android`
      # fails on `sdkmanager tools`, a package that no longer exists in cmdline-tools 16.
      - name: Accept Android SDK licences
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build the Rust library for Android ABIs
        working-directory: core
        run: |
          cargo ndk \
            -t arm64-v8a -t x86_64 \
            -o ../app/src/rust/jniLibs \
            build --release --lib

      - name: Build the APK
        working-directory: app
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ inputs.release }}" = "true" ]; then
            flutter build apk --release
          else
            # Debug-signed so CI can always produce an installable artefact.
            # phase-16 replaces this with a properly signed release build.
            flutter build apk --debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmith-apk
          path: app/build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify the APK is a real, installable archive
        working-directory: app
        run: |
          APK=$(find build/app/outputs -name '*.apk' | head -n1)
          if [ -z "${APK}" ]; then echo "::error::no APK produced"; exit 1; fi
          echo "APK: ${APK} ($(stat -c%s "${APK}") bytes)"
          # A zip bomb or an empty archive passes a size check silently.
          unzip -l "${APK}" | tail -n 1
          # An APK with no native library opens fine and crashes on first tap,
          # which no build log will ever tell you about.
          unzip -l "${APK}" | grep -q 'classes.dex' \
            || { echo "::error::APK has no classes.dex — this is not an app"; exit 1; }
          unzip -l "${APK}" | grep -q 'lib/.*/libpixelsmith_core\.so' \
            || { echo "::error::APK has no lib/*/libpixelsmith_core.so"; exit 1; }
          echo "OK: native engine present"

  # ---------------------------------------------------------------------------
  windows-exe:
    name: Windows EXE
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    # Must run on Windows: Flutter's Windows desktop toolchain is MSBuild-based
    # and will not cross-compile from Linux.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build the Rust library for Windows
        working-directory: core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\app\src\rust | Out-Null
          cargo build --release --lib
          Copy-Item target\release\pixelsmith_core.dll ..\app\src\rust\ -ErrorAction SilentlyContinue

      - name: Build the EXE
        working-directory: app
        run: flutter build windows --release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pixelsmith-windows-exe
          path: app/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

      - name: Verify the EXE and its native library
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\windows -Recurse -Filter '*.exe' |
                 Where-Object { $_.Name -notlike '*flutter*' } | Select-Object -First 1
          if (-not $exe) { Write-Output '::error::no EXE produced'; exit 1 }
          Write-Output "EXE: $($exe.FullName) ($($exe.Length) bytes)"
          if ($exe.Length -lt 100kb) {
            Write-Output "::error::EXE is $($exe.Length) bytes, implausibly small — the engine probably did not link"
            exit 1
          }
          # The engine must ship alongside the app. A missing DLL means the app
          # opens to a crash on first use, so check the whole bundle rather than
          # the Release directory alone.
          $bundle = Split-Path (Split-Path $exe.FullName -Parent) -Parent
          $dll = Get-ChildItem -Path $bundle -Recurse -Filter 'pixelsmith_core.dll' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Output '::error::pixelsmith_core.dll is not in the bundle'
            exit 1
          }
          Write-Output "OK: engine DLL at $($dll.FullName)"

  # ---------------------------------------------------------------------------
  # Not shipped yet. Best effort, so a macOS toolchain problem cannot turn the
  # build check red while Android and Windows are the only targets that matter.
  linux:
    name: Linux (best effort)
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: pixelsmith-linux
          path: app/build/linux/**/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The Rust engine on its own, for every platform, with no Flutter involved.
  # This is the artefact that proves the engine itself cross-compiles, and it is
  # the only thing that does real work before phase-05.
  engine-matrix:
    name: engine ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: aarch64-linux-android, os: ubuntu-latest }
          - { target: aarch64-apple-ios, os: macos-latest }
    steps:
      - uses: actions/checkout@v5

      # Cross-compiling to Android needs the NDK's linker. Plain `cargo build
      # --target aarch64-linux-android` fails at link time with no linker, so the
      # target goes through cargo-ndk, which supplies the right clang wrapper.
      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and test the engine
        working-directory: core
        # Windows runners default to PowerShell, which cannot parse bash `[[ ]]`.
        # This step is bash on every platform.
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *android* ]]; then
            cargo ndk -t arm64-v8a -o /tmp/px-jni build --release --lib --target aarch64-linux-android
          else
            cargo build --release --lib --target ${{ matrix.target }}
            cargo test --release --lib --target ${{ matrix.target }} --no-run
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: |
            core/target/${{ matrix.target }}/release/*.so
            core/target/${{ matrix.target }}/release/*.dll
            core/target/${{ matrix.target }}/release/*.dylib
            core/target/${{ matrix.target }}/release/*.a
          if-no-files-found: warn
          retention-days: 14